---
- name: Configure Samba server
  hosts: medded
  become: true

  tasks:
    - name: Install Samba and SELinux utilities
      ansible.builtin.dnf:
        name:
          - samba
          - samba-client
          - policycoreutils-python-utils
        state: present

    - name: Ensure Samba group exists
      ansible.builtin.group:
        name: "{{ samba_group }}"
        state: present

    - name: Ensure Samba-only user exists
      ansible.builtin.user:
        name: "{{ samba_user }}"
        group: "{{ samba_group }}"
        system: true
        create_home: false
        home: /nonexistent
        shell: /sbin/nologin
        state: present

    - name: Create directories for Samba shares
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: "{{ samba_group }}"
        mode: "2770"
      loop: "{{ samba_shares }}"

    - name: Set SELinux context for Samba shares
      community.general.sefcontext:
        target: "{{ item.path }}(/.*)?"
        setype: samba_share_t
        state: present
      loop: "{{ samba_shares }}"

    - name: Apply SELinux contexts
      ansible.builtin.command:
        argv:
          - restorecon
          - -RF
          - "{{ item.path }}"
      loop: "{{ samba_shares }}"
      changed_when: false

    - name: Deploy Samba configuration
      ansible.builtin.template:
        src: ../templates/smb.conf.j2
        dest: /etc/samba/smb.conf
        owner: root
        group: root
        mode: "0644"
        validate: "/usr/bin/testparm -s %s"
      notify: Restart Samba

    - name: Ensure firewalld is running
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: Remove unrestricted Samba firewall service
      ansible.posix.firewalld:
        service: samba
        state: disabled
        permanent: true
        immediate: true

    - name: Allow Samba only from TUL networks
      ansible.posix.firewalld:
        zone: home
        rich_rule: >-
          rule family="{{ 'ipv6' if ':' in item else 'ipv4' }}"
          source address="{{ item }}"
          service name="samba"
          accept
        state: enabled
        permanent: true
        immediate: true
      loop: "{{ samba_allowed_networks }}"

    - name: Enable and start Samba
      ansible.builtin.service:
        name: smb
        state: started
        enabled: true

  handlers:
    - name: Restart Samba
      ansible.builtin.service:
        name: smb
        state: restarted
